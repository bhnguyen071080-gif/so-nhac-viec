<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<script>window.KHOA='sb_publishable_YovJicH4FY50OIUr7IxE5Q_jPB7J4AN';</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Sổ nhắc việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6;--card:#fff;--tx:#14213d;--mut:#5a6a84;--bd:#d9e0ec;--soft:#f5f7fb;
  --night:#17224a;--night2:#26356b;--gold:#e3b04b;
  --sig:#e8590c;--sig-bg:#fff0e6;--q:#a9780f;--q-bg:#fdf3dc;--jade:#13866b;--jade-bg:#e2f5ef;--lun:#3b4a94;--lun-bg:#e9ecfa;--late:#c92a2a;--late-bg:#fdeaea;
  --f-d:'Fraunces',Georgia,serif;--f-b:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1224;--card:#151d38;--tx:#e8ecf7;--mut:#9aa7c4;--bd:#26315a;--soft:#1b2546;
  --sig:#ff8a4c;--sig-bg:#3a2316;--q:#e3b04b;--q-bg:#352a10;--jade:#4fd1ae;--jade-bg:#10312b;--lun:#a3b0ff;--lun-bg:#1f2850;--late:#ff7a7a;--late-bg:#3a1a1e;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--f-b);min-height:100%}
.app{max-width:720px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px;border-radius:8px}

/* ----- bầu trời đêm: phần nhấn duy nhất của giao diện ----- */
.sky{position:relative;overflow:hidden;margin:0 -14px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 22px;color:#fff;
  background:radial-gradient(120% 90% at 85% 0%,#3a4c9a 0%,var(--night2) 38%,var(--night) 100%);border-radius:0 0 28px 28px}
.sky::before{content:"";position:absolute;inset:0;opacity:.55;pointer-events:none;
  background-image:radial-gradient(1.2px 1.2px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 60%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 58% 14%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 72%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 92% 48%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 44% 86%,#fff 50%,transparent 51%)}
.sky-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative}
.dow{font-size:15px;opacity:.85;margin:0}
.big{font-family:var(--f-d);font-weight:800;font-size:clamp(40px,12vw,58px);line-height:1;margin:4px 0 8px;letter-spacing:-.01em}
.lunl{font-size:15px;opacity:.92;margin:0}.lunl b{font-weight:600}
.moon{flex:none;width:96px;height:96px;filter:drop-shadow(0 0 18px rgba(227,176,75,.45));animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(26px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.moon{animation:none}}
.next{position:relative;margin-top:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 14px;font-size:15px;backdrop-filter:blur(4px)}
.next small{display:block;opacity:.75;font-size:13px}.next b{font-weight:600}
.sync{position:absolute;right:20px;bottom:6px;font-size:11px;opacity:.6}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.num{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 6px;text-align:center}
.num b{display:block;font-family:var(--f-d);font-size:30px;line-height:1.1;font-weight:800}
.num span{font-size:12.5px;color:var(--mut);line-height:1.2;display:block}
.num.late b{color:var(--late)}.num.zero b{color:var(--mut)}

h2{font-family:var(--f-d);font-size:20px;font-weight:800;margin:22px 2px 8px}
.mu{color:var(--mut);font-size:14px;margin:6px 2px}
.mu a{color:var(--lun)}

/* ----- nhóm và dòng việc ----- */
.grp{margin:0 0 12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden}
.grp>h3{margin:0;padding:11px 14px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--soft)}
.grp>h3 em{font-style:normal;font-size:13px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--bd);color:var(--tx)}
.grp.late>h3{background:var(--late-bg);color:var(--late)}.grp.late>h3 em{background:var(--late);color:#fff}
.grp.warn>h3{background:var(--q-bg);color:var(--q)}.grp.warn>h3 em{background:var(--q);color:#fff}
.grp.lun>h3{background:var(--lun-bg);color:var(--lun)}.grp.lun>h3 em{background:var(--lun);color:#fff}
.grp.ok>h3{background:var(--jade-bg);color:var(--jade)}
.grp ul{list-style:none;margin:0;padding:4px 14px 10px}.grp li{padding:7px 0;border-top:1px solid var(--bd)}.grp li:first-child{border-top:0}
.day{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:16px 4px 6px}.day b{font-family:var(--f-d);font-size:19px;font-weight:800}.day span{font-size:13.5px;color:var(--mut)}
.day.now b{color:var(--sig)}

.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:11px 12px;margin-bottom:8px;position:relative}
.it::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--bd)}
.it.pK::before{background:var(--sig)}.it.pQ::before{background:var(--gold)}.it.lunar::before{background:var(--lun)}
.it .t{flex:1;min-width:0}.it .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.it .m{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13.5px;color:var(--mut);margin-top:2px;align-items:center}
.it.dn .t b{text-decoration:line-through;color:var(--mut)}
.tag{font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--mut)}
.tag.k{background:var(--sig-bg);color:var(--sig)}.tag.q{background:var(--q-bg);color:var(--q)}.tag.l{background:var(--late-bg);color:var(--late)}.tag.w{background:var(--q-bg);color:var(--q)}.tag.n{background:var(--lun-bg);color:var(--lun)}
.ck{flex:none;position:relative;width:28px;height:28px}
.ck input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:2px solid var(--mut);border-radius:9px;margin:0;cursor:pointer;display:grid;place-content:center;background:var(--card);transition:background .15s,border-color .15s}
.ck input:checked{background:var(--jade);border-color:var(--jade)}
.ck input:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.mk{flex:none;width:28px;height:28px;border-radius:50%;background:var(--lun-bg);color:var(--lun);display:grid;place-content:center;font-size:15px}
.ic{flex:none;position:relative;width:40px;height:40px;border:0;border-radius:12px;background:var(--soft);color:var(--mut);display:grid;place-content:center;cursor:pointer;font-size:17px;text-decoration:none}
.ic.del{color:var(--late)}.ic:active{transform:scale(.94)}
.ic input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.b{border:0;border-radius:14px;background:var(--sig);color:#fff;font-weight:600;padding:12px 18px;cursor:pointer;min-height:46px}
.b.alt{background:var(--lun)}.b:active{transform:scale(.98)}

/* ----- biểu mẫu ----- */
.form{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;text-align:left;font-family:inherit}
.form label.f{display:grid;gap:3px;font-size:13.5px;color:var(--mut)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--soft);min-height:46px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:10px 4px;border:1.5px solid var(--bd);border-radius:12px;font-size:14px;font-weight:600;background:var(--soft);line-height:1.25}
.seg small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.seg input:checked+span{border-color:var(--sig);background:var(--sig-bg);color:var(--sig)}
.seg.l input:checked+span{border-color:var(--lun);background:var(--lun-bg);color:var(--lun)}
.seg input:focus-visible+span{outline:3px solid var(--sig);outline-offset:2px}

/* ----- lịch tháng ----- */
.nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px}
.nav b{font-family:var(--f-d);font-size:21px;font-weight:800}
.nav button{width:46px;height:46px;border:1px solid var(--bd);background:var(--card);border-radius:14px;font-size:20px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{text-align:center;font-size:12.5px;color:var(--mut);padding:2px}
.d{aspect-ratio:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px 0 0;font-size:16px;font-weight:500;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15}
.d i{font-style:normal;font-size:11.5px;color:var(--mut);font-weight:400}.d.o{opacity:.35}
.d.t{border-color:var(--sig);box-shadow:inset 0 0 0 1.5px var(--sig)}
.d.m i{color:var(--lun);font-weight:700}
.d.s{background:var(--night);color:#fff;border-color:var(--night)}.d.s i{color:#c9d2ff}
.d u{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.pick{margin-top:12px}

/* ----- thanh điều hướng dưới ----- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:0 10px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar nav{pointer-events:auto;width:100%;max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--bd);border-radius:22px;box-shadow:0 8px 28px rgba(12,18,36,.22);backdrop-filter:blur(10px)}
.bar button{border:0;background:none;padding:8px 4px 6px;border-radius:16px;color:var(--mut);cursor:pointer;display:grid;justify-items:center;gap:1px;font-size:13px;font-weight:600}
.bar button svg{width:24px;height:24px}
.bar button.on{background:var(--night);color:#fff}

#lg{display:none;position:fixed;inset:0;z-index:9;background:var(--bg);align-items:center;justify-content:center;padding:20px}
#lg .box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:22px;display:grid;gap:10px}
#lg h1{font-family:var(--f-d);font-size:26px;margin:0 0 4px}
.foot{margin-top:24px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--bd);font-size:14px;color:var(--mut)}
.foot b{color:var(--tx)}

/* ===== v2: khối nổi 3D, nút bấm nổi, màu mức nhắc xanh – vàng – đỏ ===== */
:root{--g:#1f9d55;--g-bg:#e1f6ea;--g-tx:#14703c;--y:#f2b300;--y-bg:#fff4cc;--y-tx:#8a6200;--r:#e03131;--r-bg:#fde8e8;--r-tx:#b02525;
  --edge:#c0cadd;--btn-top:#ffffff;--btn-bot:#e4e9f4;--lift:0 10px 18px -6px rgba(20,33,61,.28)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#4cd68a;--g-bg:#12331f;--g-tx:#6fe3a2;--y:#ffd24a;--y-bg:#3a2f0c;--y-tx:#ffd24a;--r:#ff7070;--r-bg:#3b1a1c;--r-tx:#ff9a9a;
  --edge:#05081a;--btn-top:#26335f;--btn-bot:#1a2447;--lift:0 10px 18px -6px rgba(0,0,0,.6)}}

/* tít đầu nổi khối */
.app{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.sky{margin:0;padding:20px 20px 24px;border-radius:30px;
  background:radial-gradient(120% 100% at 85% -10%,#4a5eb8 0%,var(--night2) 40%,#101a40 100%);
  box-shadow:0 8px 0 #0b1233,0 26px 36px -10px rgba(10,16,48,.65),inset 0 2px 0 rgba(255,255,255,.28),inset 0 -14px 28px rgba(0,0,0,.28);
  transform:perspective(900px) rotateX(2.5deg);transform-origin:50% 100%}
.big{text-shadow:0 1px 0 #dfe4ff,0 2px 0 #b9c2f2,0 3px 0 #94a0e0,0 4px 0 #7380cc,0 5px 0 #5461b3,0 14px 18px rgba(0,0,0,.5);letter-spacing:.005em}
.dow,.lunl{text-shadow:0 2px 3px rgba(0,0,0,.35)}
.moon{width:104px;height:104px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(246,231,180,.35))}
.next{background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.28);box-shadow:0 4px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.35);border-radius:18px}
.sync{right:22px;bottom:7px}

/* khối nổi */
.num,.grp,.it,.form,.foot{box-shadow:0 4px 0 var(--edge),var(--lift)}
.num{border-radius:18px}
.grp{border-radius:20px}
.it{border-radius:18px;padding:12px 12px 12px 18px}
.it::before{width:8px;top:0;bottom:0;border-radius:18px 0 0 18px;background:var(--g)}

/* mức nhắc: xanh = thường, vàng = quan trọng, đỏ = khẩn */
.it.pT::before,.it.lunar.pT::before{background:var(--g)}
.it.pQ::before,.it.lunar.pQ::before{background:var(--y)}
.it.pK::before,.it.lunar.pK::before{background:var(--r)}
.it.pT{background:linear-gradient(90deg,var(--g-bg),var(--card) 38%)}
.it.pQ{background:linear-gradient(90deg,var(--y-bg),var(--card) 38%)}
.it.pK{background:linear-gradient(90deg,var(--r-bg),var(--card) 38%)}
.it.dn{background:var(--card);opacity:.7}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px}
.tag.g{background:var(--g-bg);color:var(--g-tx);box-shadow:inset 0 0 0 1.5px var(--g)}
.tag.q{background:var(--y-bg);color:var(--y-tx);box-shadow:inset 0 0 0 1.5px var(--y)}
.tag.k{background:var(--r-bg);color:var(--r-tx);box-shadow:inset 0 0 0 1.5px var(--r)}
.tag.l{background:var(--r);color:#fff;box-shadow:none}
.tag.w{background:var(--y-bg);color:var(--y-tx);box-shadow:inset 0 0 0 1.5px var(--y)}
.grp.late>h3{background:var(--r-bg);color:var(--r-tx)}.grp.late>h3 em{background:var(--r);color:#fff}
.grp.warn>h3{background:var(--y-bg);color:var(--y-tx)}.grp.warn>h3 em{background:var(--y);color:#3d2b00}
.grp.ok>h3{background:var(--g-bg);color:var(--g-tx)}
.num.late b{color:var(--r)}
.day.now b{color:var(--r)}

/* nút bấm nổi */
.b{background:linear-gradient(#ff8a52,#e8590c);color:#fff;border:0;border-radius:16px;min-height:50px;font-weight:700;letter-spacing:.01em;text-shadow:0 1px 1px rgba(0,0,0,.25);
  box-shadow:0 6px 0 #a63f08,0 12px 18px -4px rgba(120,40,0,.45),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .08s,box-shadow .08s}
.b.alt{background:linear-gradient(#5668c8,#34408f);box-shadow:0 6px 0 #1d2660,0 12px 18px -4px rgba(20,28,90,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.b:active{transform:translateY(5px);box-shadow:0 1px 0 #a63f08,0 3px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.b.alt:active{box-shadow:0 1px 0 #1d2660,0 3px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.ic{width:44px;height:44px;border-radius:14px;color:var(--tx);background:linear-gradient(var(--btn-top),var(--btn-bot));box-shadow:0 4px 0 var(--edge),0 8px 12px -4px rgba(20,33,61,.3),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .08s,box-shadow .08s}
.ic:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.4)}
.ic.del{color:var(--r)}
.ck,.ck input{width:32px;height:32px}
.ck input{border-radius:10px;border:2px solid var(--edge);background:linear-gradient(var(--btn-top),var(--btn-bot));box-shadow:0 3px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.6)}
.ck input:checked{background:linear-gradient(#3fcf7e,#1f9d55);border-color:#14703c;box-shadow:0 3px 0 #14703c}
.mk{width:32px;height:32px;box-shadow:0 3px 0 var(--edge)}
.seg label:nth-child(1) span{--c:var(--g);--cb:var(--g-bg);--ct:var(--g-tx)}
.seg label:nth-child(2) span{--c:var(--y);--cb:var(--y-bg);--ct:var(--y-tx)}
.seg label:nth-child(3) span{--c:var(--r);--cb:var(--r-bg);--ct:var(--r-tx)}
.seg span{border:2px solid var(--c);background:linear-gradient(var(--btn-top),var(--btn-bot));color:var(--tx);border-radius:14px;box-shadow:0 5px 0 var(--c),0 9px 12px -4px rgba(20,33,61,.3);transition:transform .08s,box-shadow .08s;padding:10px 4px}
.seg input:checked+span,.seg.l input:checked+span{background:var(--cb);color:var(--ct);border-color:var(--c);transform:translateY(4px);box-shadow:0 1px 0 var(--c),inset 0 3px 6px rgba(0,0,0,.18)}
.d{border-radius:14px;box-shadow:0 3px 0 var(--edge)}
.d.s{box-shadow:0 1px 0 #0b1233,inset 0 3px 6px rgba(0,0,0,.4);transform:translateY(2px)}
.nav button{border-radius:16px;background:linear-gradient(var(--btn-top),var(--btn-bot));box-shadow:0 4px 0 var(--edge),0 8px 12px -4px rgba(20,33,61,.3);color:var(--tx)}
.nav button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.bar nav{border-radius:26px;box-shadow:0 10px 0 -2px var(--edge),0 18px 30px -8px rgba(12,18,36,.45)}
.bar button{border-radius:18px;background:linear-gradient(var(--btn-top),var(--btn-bot));color:var(--mut);box-shadow:0 4px 0 var(--edge);margin-bottom:4px;transition:transform .08s,box-shadow .08s}
.bar button.on{background:linear-gradient(#2c3b80,#17224a);color:#fff;transform:translateY(3px);box-shadow:0 1px 0 #0b1233,inset 0 3px 8px rgba(0,0,0,.45)}
@media(prefers-reduced-motion:reduce){.b,.ic,.seg span,.bar button{transition:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body>
<div class="app">
  <header class="sky">
    <div class="sky-top">
      <div><p class="dow" id="hd"></p><div class="big" id="hd2"></div><p class="lunl" id="hl"></p></div>
      <div class="moon" id="moon" aria-hidden="true"></div>
    </div>
    <div class="next" id="next"></div>
    <span class="sync" id="st">…</span>
  </header>
  <div class="nums" id="stats"></div>
  <main>
    <div id="p0"></div><div id="p1" hidden></div><div id="p2" hidden></div>
  </main>
  <div class="foot" id="tgs"></div>
  <p class="mu"><a href="#" onclick="logout();return false">Đăng xuất</a></p>

'<h2>Thêm ngày âm lịch</h2><div class="form"><label class="f">Tên<input type="text" id="lt" placeholder="Ví dụ: Giỗ ông nội"></label><div class="two"><label class="f">Ngày âm<input type="number" id="ld" min="1" max="30" inputmode="numeric"></label><label class="f">Tháng âm (0 = mọi tháng)<input type="number" id="lm" min="0" max="12" inputmode="numeric" value="0"></label></div>'+
'<div class="two"><label class="f">Báo trước<select id="lb"><option value="0">Đúng ngày</option><option value="1" selected>Trước 1 ngày</option><option value="2">Trước 2 ngày</option></select></label><label class="f">Giờ nhắc<input type="time" id="lg" value="07:30"></label></div>'+seg('lpv','l',"Q")+
'<button class="b alt" onclick="addL()">Thêm ngày âm lịch</button><div class="mu" style="margin:0">Tự lặp lại mỗi năm theo âm lịch.</div></div>'+
'<h2>Danh sách ('+S.lunar.length+')</h2>'+S.lunar.slice().sort((a,b)=>(a.m||0)-(b.m||0)||a.d-b.d).map(eit).join('')}
function render(){const t=TODAY(),l=lun(t);$('#hd').textContent=DOW[dowK(t)];$('#hd2').textContent=fm(t,1);$('#hl').innerHTML='Âm lịch <b>'+l.d+'/'+l.m+(l.leap?' nhuận':'')+'</b> · năm '+cc(l.y);$('#moon').innerHTML=moonSvg(l.d);$('#next').innerHTML=nextUp();renderStats();renderToday();renderTasks();renderLunar()}
/* ---- thao tác ---- */
const nid=()=>Date.now()+Math.floor(Math.random()*1000);
function addT(){const t=$('#nt').value.trim(),d=$('#nd').value;if(!t)return;S.tasks.push({id:nid(),t,due:d||'',o:$('#no').value.trim(),rep:$('#nr').value,pr:rv('npv'),g:$('#ng').value||'07:30',done:false});save();render();tab=1}
function tog(id){const x=S.tasks.find(a=>a.id===id);x.done=!x.done;if(x.done&&x.due&&x.rep&&x.rep!=='Không'){let n=x.due;do{const[a,b,c]=P(n);n=x.rep==='Ngày'?add(n,1):x.rep==='Tuần'?add(n,7):K(new Date(a,b,Math.min(c,new Date(a,b+1,0).getDate())))}while(n<TODAY());S.tasks.push({id:nid(),t:x.t,due:n,o:x.o||'',rep:x.rep,pr:x.pr||'T',g:x.g||'07:30',done:false})}save();render()}
function chDue(id,d){const x=S.tasks.find(a=>a.id===id);if(!d||d===x.due){render();return}
const msg=x.due?'Hành động: đổi hạn chót việc "'+x.t+'"\nDữ liệu đổi: '+fm(x.due,1)+' → '+fm(d,1)+'\nẢnh hưởng: nhắc việc, chuông và Google Calendar sẽ theo ngày mới. Xác nhận?':'Hành động: đặt hạn chót '+fm(d,1)+' cho việc "'+x.t+'". Xác nhận?';
if(!confirm(msg)){render();return}x.due=d;save();render()}
function delT(id){const x=S.tasks.find(a=>a.id===id);if(!confirm('Hành động: xóa việc "'+x.t+'". Việc sẽ mất khỏi danh sách và lịch nhắc, không hoàn tác. Xác nhận xóa?'))return;S.tasks=S.tasks.filter(a=>a.id!==id);save();render()}
function addL(){const t=$('#lt').value.trim(),d=+$('#ld').value,m=+$('#lm').value||0;if(!t||d<1||d>30||m<0||m>12)return;if(!confirm('Thêm việc âm lịch "'+t+'" vào ngày '+d+(m?'/'+m:' hằng tháng')+' âm lịch, nhắc trước '+$('#lb').value+' ngày.'+(d===30?' Lưu ý: tháng thiếu không có ngày 30, hệ thống sẽ nhắc vào ngày 29.':'')+' Xác nhận lưu?'))return;S.lunar.push({id:nid(),t,d,m,b:+$('#lb').value,pr:rv('lpv'),g:$('#lg').value||'07:30'});save();render()}
function okL(id){const x=S.lunar.find(a=>a.id===id);if(!confirm('Xác nhận "'+x.t+'" ('+x.d+(x.m?'/'+x.m:' hằng tháng')+' âm lịch) là ngày chính thức, bắt đầu được nhắc trước '+x.b+' ngày?'))return;delete x.p;save();render()}
function delL(id){const x=S.lunar.find(a=>a.id===id);if(!confirm('Hành động: xóa ngày "'+x.t+'" khỏi lịch âm. Lịch nhắc của ngày này sẽ mất. Xác nhận xóa?'))return;S.lunar=S.lunar.filter(a=>a.id!==id);save();render()}
function pick(k){sel=k;renderLunar()}
function mv(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderLunar()}
function setTab(n){tab=n;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',+x.dataset.t===n));[0,1,2].forEach(i=>$('#p'+i).hidden=i!==n);window.scrollTo({top:0})}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(+b.dataset.t));
render();stt('Lưu trên thiết bị');
(async()=>{const{data:{session}}=await SB.auth.getSession();if(!session){$('#lg').style.display='flex';return}await boot(session.user)})();
async function boot(u){uid=u.id;$('#lg').style.display='none';const{data}=await SB.from('app_state').select('data,telegram_chat_id').eq('user_id',uid).maybeSingle();
if(data&&data.data&&data.data.lunar){S=data.data;render()}else save();tgState(data&&data.telegram_chat_id);stt('Đã lưu trên tài khoản')}
async function login(){const{data,error}=await SB.auth.signInWithPassword({email:$('#lgE').value.trim(),password:$('#lgP').value});if(error){$('#lerr').textContent='Sai email hoặc mật khẩu';return}await boot(data.user)}
async function logout(){await SB.auth.signOut();location.reload()}
function tgState(c){$('#tgs').innerHTML='<b>Telegram:</b> '+(c?'đã ghép nối. ':'chưa ghép nối. ')+'<button class="b alt" style="min-height:40px;padding:8px 14px;margin-left:6px" onclick="pair()">'+(c?'Ghép lại':'Tạo mã ghép nối')+'</button>'}
async function pair(){const code=Math.random().toString(36).slice(2,10).padEnd(8,'x');const{error}=await SB.from('app_state').upsert({user_id:uid,pair_code:code});$('#tgs').innerHTML=error?esc(error.message):'Mở bot trong Telegram và gửi: <b>/start '+code+'</b>'}
</script></body></html>
