'<div class="card a" style="margin-top:10px"><h3>'+fm(sel,1)+' = '+sl2.d+'/'+sl2.m+(sl2.leap?' nhuận':'')+' âm lịch, năm '+cc(sl2.y)+'</h3>'+(ev.length||tk.length?'<ul>'+ev.map(e=>'<li>'+esc(e.t)+'</li>').join('')+tk.map(x=>'<li>'+esc(x.t)+' (việc)</li>').join('')+'</ul>':'<span class="mu">Không có việc.</span>')+'</div>'+
'<h2>Thêm việc âm lịch (lặp lại tự động mỗi năm)</h2><div class="row"><input type="text" id="lt" placeholder="Tên việc, ví dụ: Giỗ…"><input type="number" id="ld" min="1" max="30" placeholder="Ngày"><input type="number" id="lm" min="0" max="12" placeholder="Tháng"><select id="lb"><option value="0">Nhắc đúng ngày</option><option value="1" selected>Trước 1 ngày</option><option value="2">Trước 2 ngày</option></select><button class="b" onclick="addL()">Thêm</button></div><div class="mu">Tháng để 0 hoặc trống = lặp hằng tháng.</div>'+
'<h2>Danh sách ('+S.lunar.length+')</h2>'+S.lunar.slice().sort((a,b)=>(a.m||0)-(b.m||0)||a.d-b.d).map(eit).join('')}
function render(){const t=TODAY(),l=lun(t);$('#hd').textContent=DOW[dowK(t)];$('#hd2').textContent=fm(t,1);$('#hl').textContent='Âm lịch '+l.d+'/'+l.m+(l.leap?' nhuận':'')+' · năm '+cc(l.y);renderStats();renderToday();renderTasks();renderLunar()}
/* ---- thao tác ---- */
const nid=()=>Date.now()+Math.floor(Math.random()*1000);
function addT(){const t=$('#nt').value.trim(),d=$('#nd').value;if(!t)return;S.tasks.push({id:nid(),t,due:d||'',o:$('#no').value.trim(),rep:$('#nr').value,done:false});save();render();tab=1}
function setDue(id,d){if(!d)return;const x=S.tasks.find(a=>a.id===id);if(!confirm('Đặt hạn chót '+fm(d,1)+' cho việc "'+x.t+'". Xác nhận?'))return;x.due=d;save();render()}
function tog(id){const x=S.tasks.find(a=>a.id===id);x.done=!x.done;if(x.done&&x.due&&x.rep&&x.rep!=='Không'){let n=x.due;do{const[a,b,c]=P(n);n=x.rep==='Ngày'?add(n,1):x.rep==='Tuần'?add(n,7):K(new Date(a,b,Math.min(c,new Date(a,b+1,0).getDate())))}while(n<TODAY());S.tasks.push({id:nid(),t:x.t,due:n,o:x.o||'',rep:x.rep,done:false})}save();render()}
function delT(id){const x=S.tasks.find(a=>a.id===id);if(!confirm('Hành động: xóa việc "'+x.t+'". Việc sẽ mất khỏi danh sách và lịch nhắc, không hoàn tác. Xác nhận xóa?'))return;S.tasks=S.tasks.filter(a=>a.id!==id);save();render()}
function addL(){const t=$('#lt').value.trim(),d=+$('#ld').value,m=+$('#lm').value||0;if(!t||d<1||d>30||m<0||m>12)return;if(!confirm('Thêm việc âm lịch "'+t+'" vào ngày '+d+(m?'/'+m:' hằng tháng')+' âm lịch, nhắc trước '+$('#lb').value+' ngày.'+(d===30?' Lưu ý: tháng thiếu không có ngày 30, hệ thống sẽ nhắc vào ngày 29.':'')+' Xác nhận lưu?'))return;S.lunar.push({id:nid(),t,d,m,b:+$('#lb').value});save();render()}
function okL(id){const x=S.lunar.find(a=>a.id===id);if(!confirm('Xác nhận "'+x.t+'" ('+x.d+(x.m?'/'+x.m:' hằng tháng')+' âm lịch) là ngày chính thức, bắt đầu được nhắc trước '+x.b+' ngày?'))return;delete x.p;save();render()}
function delL(id){const x=S.lunar.find(a=>a.id===id);if(!confirm('Hành động: xóa ngày "'+x.t+'" khỏi lịch âm. Lịch nhắc của ngày này sẽ mất. Xác nhận xóa?'))return;S.lunar=S.lunar.filter(a=>a.id!==id);save();render()}
function pick(k){sel=k;renderLunar()}
function mv(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderLunar()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));[0,1,2].forEach(i=>$('#p'+i).hidden=i!==tab)});
render();stt('Lưu trên thiết bị');
(async()=>{const{data:{session}}=await SB.auth.getSession();if(!session){$('#lg').style.display='flex';return}await boot(session.user)})();
async function boot(u){uid=u.id;$('#lg').style.display='none';const{data}=await SB.from('app_state').select('data,telegram_chat_id').eq('user_id',uid).maybeSingle();
if(data&&data.data&&data.data.lunar){S=data.data;render()}else save();tgState(data&&data.telegram_chat_id);stt('Đã lưu trên tài khoản')}
async function login(){const{data,error}=await SB.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error){$('#lerr').textContent='Sai email hoặc mật khẩu';return}await boot(data.user)}
async function logout(){await SB.auth.signOut();location.reload()}
function tgState(c){$('#tgs').innerHTML=(c?'Đã ghép nối Telegram. ':'Chưa ghép nối. ')+'<button class="b" onclick="pair()">'+(c?'Ghép lại':'Tạo mã ghép nối')+'</button>'}
async function pair(){const code=Math.random().toString(36).slice(2,10).padEnd(8,'x');const{error}=await SB.from('app_state').upsert({user_id:uid,pair_code:code});$('#tgs').innerHTML=error?esc(error.message):'Mở bot trong Telegram và gửi: <b>/start '+code+'</b>'}
</script></body></html>
